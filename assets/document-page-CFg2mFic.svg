"122.5" y="835" width="613" height="25.796875"/><rect x="58.5" y="860.796875" width="64" height="42.59375"/><rect x="122.5" y="860.796875" width="613" height="42.59375"/><rect x="58.5" y="903.390625" width="64" height="25.796875"/><rect x="122.5" y="903.390625" width="613" height="25.796875"/><rect x="58.5" y="929.1875" width="64" height="42.59375"/><rect x="122.5" y="929.1875" width="613" height="42.59375"/><rect x="58.5" y="971.78125" width="64" height="25.796875"/><rect x="122.5" y="971.78125" width="613" height="25.796875"/><rect x="58.5" y="997.578125" width="64" height="25.796875"/><rect x="122.5" y="997.578125" width="613" height="25.796875"/><rect x="58.5" y="1023.375" width="64" height="25.796875"/><rect x="122.5" y="1023.375" width="613" height="25.796875"/></g><g fill="#111" font-family="Times New Roman, Liberation Serif, serif"><text x="444" y="80" font-size="12" font-weight="400">ПРИЛОЖЕНИЕ</text>
<text x="444" y="96.796875" font-size="12" font-weight="400">к Свидетельству о допуске к работам по подготовке</text>
<text x="444" y="113.59375" font-size="12" font-weight="400">проектной документации, которые оказывают влияние</text>
<text x="444" y="130.390625" font-size="12" font-weight="400">на безопасность объектов капитального строительства</text>
<text x="444" y="147.1875" font-size="12" font-weight="400">от «19» мая 2014 г.</text>
<text x="444" y="163.984375" font-size="12" font-weight="400">№ 2195</text>
<text x="237.046875" y="204.78125" font-size="12" font-weight="700">Виды работ, которые оказывают влияние на безопасность:</text>
<text x="58" y="237.578125" font-size="12" font-weight="400">1.</text>
<text x="82" y="237.578125" font-size="12" font-weight="400">объектов капитального строительства, включая особо опасные и технически сложные объекты капитального строительства</text>
<text x="82" y="254.375" font-size="12" font-weight="400">(кроме объектов использования атомной энергии), и о допуске к которым</text>
<text x="460.359375" y="254.375" font-size="12" font-weight="700">член НП СРО проектировщиков «СтройПроект»</text>
<text x="82" y="271.171875" font-size="12" font-weight="700">Общество с ограниченной ответственностью «Северо-Западный центр услуг» ИНН 7840455662 имеет Свидетельство</text>
<text x="76.84375" y="302.96875" font-size="12" font-weight="400">№ пп</text>
<text x="362.59375" y="302.96875" font-size="12" font-weight="400">Наименование вида работ</text>
<text x="131" y="328.765625" font-size="12" font-weight="400">НЕТ</text>
<text x="58" y="370.5625" font-size="12" font-weight="400">2.</text>
<text x="82" y="370.5625" font-size="12" font-weight="400">объектов капитального строительства, включая особо опасные и технически сложные объекты капитального строительства</text>
<text x="82" y="387.359375" font-size="12" font-weight="400">(кроме объектов использования атомной энергии) и о допуске к которым</text>
<text x="457.359375" y="387.359375" font-size="12" font-weight="700">член НП СРО проектировщиков «СтройПроект»</text>
<text x="82" y="404.15625" font-size="12" font-weight="700">Общество с ограниченной ответственностью «Северо-Западный центр услуг» ИНН 7840455662 имеет Свидетельство</text>
<text x="76.84375" y="435.953125" font-size="12" font-weight="400">№ пп</text>
<text x="362.59375" y="435.953125" font-size="12" font-weight="400">Наименование вида работ</text>
<text x="131" y="461.75" font-size="12" font-weight="400">НЕТ</text>
<text x="58" y="503.546875" font-size="12" font-weight="400">3.</text>
<text x="82" y="503.546875" font-size="12" font-weight="400">объектов капитального строительства (кроме особо опасных и технически сложных объектов, объектов использования атомной</text>
<text x="82" y="520.34375" font-size="12" font-weight="400">энергии) и о допуске к которым</text>
<text x="247.4375" y="520.34375" font-size="12" font-weight="700">член НП СРО проектировщиков «СтройПроект» Общество с ограниченной</text>
<text x="82" y="537.140625" font-size="12" font-weight="700">ответственностью «Северо-Западный центр услуг» ИНН 7840455662 имеет Свидетельство</text>
<text x="76.84375" y="568.9375" font-size="12" font-weight="400">№ пп</text>
<text x="362.59375" y="568.9375" font-size="12" font-weight="400">Наименование вида работ</text>
<text x="67" y="594.734375" font-size="12" font-weight="400">1.</text>
<text x="131" y="594.734375" font-size="12" font-weight="400">РАБОТЫ ПО ПОДГОТОВКЕ СХЕМЫ ПЛАНИРОВОЧНОЙ ОРГАНИЗАЦИИ ЗЕМЕЛЬНОГО УЧАСТКА:</text>
<text x="67" y="620.53125" font-size="12" font-weight="400">1.1.</text>
<text x="131" y="620.53125" font-size="12" font-weight="400">Работы по подготовке генерального плана земельного участка</text>
<text x="67" y="646.328125" font-size="12" font-weight="400">1.2.</text>
<text x="131" y="646.328125" font-size="12" font-weight="400">Работы по подготовке схемы планировочной организации трассы линейного объекта</text>
<text x="67" y="672.125" font-size="12" font-weight="400">1.3.</text>
<text x="131" y="672.125" font-size="12" font-weight="400">Работы по подготовке схемы планировочной организации полосы отвода линейного сооружения</text>
<text x="67" y="697.921875" font-size="12" font-weight="400">2.</text>
<text x="131" y="697.921875" font-size="12" font-weight="400">Работы по подготовке архитектурных решений</text>
<text x="67" y="723.71875" font-size="12" font-weight="400">3.</text>
<text x="131" y="723.71875" font-size="12" font-weight="400">Работы по подготовке конструктивных решений</text>
<text x="67" y="749.515625" font-size="12" font-weight="400">4.</text>
<text x="131" y="749.515625" font-size="12" font-weight="400">РАБОТЫ ПО ПОДГОТОВКЕ СВЕДЕНИЙ О ВНУТРЕННЕМ ИНЖЕНЕРНОМ ОБОРУДОВАНИИ, ВНУТРЕННИХ</text>
<text x="131" y="766.3125" font-size="12" font-weight="400">СЕТЯХ ИНЖЕНЕРНО-ТЕХНИЧЕСКОГО ОБЕСПЕЧЕНИЯ, О ПЕРЕЧНЕ ИНЖЕНЕРНО-ТЕХНИЧЕСКИХ</text>
<text x="131" y="783.109375" font-size="12" font-weight="400">МЕРОПРИЯТИЙ:</text>
<text x="67" y="808.90625" font-size="12" font-weight="400">4.1.</text>
<text x="131" y="808.90625" font-size="12" font-weight="400">Работы по подготовке проектов внутренних инженерных систем отопления, вентиляции, кондиционирования,</text>
<text x="131" y="825.703125" font-size="12" font-weight="400">противодымной вентиляции, теплоснабжения и холодоснабжения</text>
<text x="67" y="851.5" font-size="12" font-weight="400">4.2.</text>
<text x="131" y="851.5" font-size="12" font-weight="400">Работы по подготовке проектов внутренних инженерных систем водоснабжения и канализации</text>
<text x="67" y="877.296875" font-size="12" font-weight="400">4.5.</text>
<text x="131" y="877.296875" font-size="12" font-weight="400">Работы по подготовке проектов внутренних систем диспетчеризации, автоматизации и управления инженерными</text>
<text x="131" y="894.09375" font-size="12" font-weight="400">системами</text>
<text x="67" y="919.890625" font-size="12" font-weight="400">4.6.</text>
<text x="131" y="919.890625" font-size="12" font-weight="400">Работы по подготовке проектов внутренних систем газоснабжения</text>
<text x="67" y="945.6875" font-size="12" font-weight="400">5.</text>
<text x="131" y="945.6875" font-size="12" font-weight="400">РАБОТЫ ПО ПОДГОТОВКЕ СВЕДЕНИЙ О НАРУЖНЫХ СЕТЯХ ИНЖЕНЕРНО-ТЕХНИЧЕСКОГО</text>
<text x="131" y="962.484375" font-size="12" font-weight="400">ОБЕСПЕЧЕНИЯ, О ПЕРЕЧНЕ ИНЖЕНЕРНО-ТЕХНИЧЕСКИХ МЕРОПРИЯТИЙ:</text>
<text x="67" y="988.28125" font-size="12" font-weight="400">5.1.</text>
<text x="131" y="988.28125" font-size="12" font-weight="400">Работы по подготовке проектов наружных сетей теплоснабжения и их сооружений</text>
<text x="67" y="1014.078125" font-size="12" font-weight="400">5.2.</text>
<text x="131" y="1014.078125" font-size="12" font-weight="400">Работы по подготовке проектов наружных сетей водоснабжения и канализации и их сооружений</text>
<text x="67" y="1039.875" font-size="12" font-weight="400">5.3.</text>
<text x="131" y="1039.875" font-size="12" font-weight="400">Работы по подготовке проектов наружных сетей электроснабжения до 35 кВ включительно и их сооружений</text></g></svg>
